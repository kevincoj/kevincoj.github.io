# Edit wording at https://app.pagescms.org after connecting this repository.
settings:
  content:
    merge: true
content:
  - name: site
    label: "Homepage & crosswords"
    type: file
    path: content/site.json
    format: json
    fields:
      - name: intro
        label: "Homepage introduction"
        type: text
        required: true
      - name: about_heading
        label: "About heading"
        type: string
        required: true
      - name: about
        label: "About paragraph"
        type: text
        required: true
      - name: footer
        label: "Footer text"
        type: text
        required: true
      - name: crosswords_heading
        label: "Crossword banner heading"
        type: string
        required: true
      - name: crosswords_summary
        label: "Crossword banner description"
        type: text
        required: true
      - name: crossword_empty_intro
        label: "Crosswords: no puzzles introduction"
        type: text
        required: true
      - name: crossword_published_intro
        label: "Crosswords: introduction when puzzles are published"
        type: text
        required: true
      - name: crossword_empty_status
        label: "Crosswords: empty collection message"
        type: text
        required: true
      - name: crossword_collection_note
        label: "Crosswords: collection note"
        type: text
        required: true
  - name: vid2tab
    label: "Vid2Tab text"
    type: file
    path: content/vid2tab.json
    format: json
    fields:
      - name: title
        label: "Project name"
        type: text
        required: true
        description: "A new line creates a line break. Project links stay the same."
      - name: status
        label: "Project status"
        type: string
        required: true
      - name: description
        label: "Short project description"
        type: text
        required: true
      - name: tags
        label: "Technology tags"
        type: string
        required: true
        list: true
      - name: story_title
        label: "Writeup title"
        type: text
        required: true
      - name: walkthrough_caption
        label: "Walkthrough description (beside video)"
        type: text
        required: true
      - name: why_heading
        label: "Why I built it — heading"
        type: string
        required: true
      - name: why_body
        label: "Why I built it — paragraphs"
        type: text
        required: true
        description: "Separate paragraphs with a blank line. Plain text; no HTML needed."
      - name: engineering_heading
        label: "Turning the idea into a working product — heading"
        type: string
        required: true
      - name: engineering_body
        label: "Turning the idea into a working product — paragraphs"
        type: text
        required: true
        description: "Separate paragraphs with a blank line. Plain text; no HTML needed."
      - name: practice_heading
        label: "Beyond PDF extraction — heading"
        type: string
        required: true
      - name: practice_body
        label: "Beyond PDF extraction — paragraphs"
        type: text
        required: true
        description: "Separate paragraphs with a blank line. Plain text; no HTML needed."
      - name: ai_heading
        label: "Building with AI agents — heading"
        type: string
        required: true
      - name: ai_body
        label: "Building with AI agents — paragraphs"
        type: text
        required: true
        description: "Separate paragraphs with a blank line. Plain text; no HTML needed."
      - name: next_heading
        label: "What's next — heading"
        type: string
        required: true
      - name: next_body
        label: "What's next — paragraphs"
        type: text
        required: true
        description: "Separate paragraphs with a blank line. Plain text; no HTML needed."
      - name: caption
        label: "Before/after image caption"
        type: text
        required: true
  - name: teachla
    label: "TeachLA text"
    type: file
    path: content/teachla.json
    format: json
    fields:
      - name: title
        label: "Project name"
        type: text
        required: true
        description: "A new line creates a line break. Project links stay the same."
      - name: status
        label: "Project status"
        type: string
        required: true
      - name: description
        label: "Short project description"
        type: text
        required: true
      - name: details
        label: "Project details"
        type: text
        required: true
